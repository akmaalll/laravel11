- name: Deploy to VPS
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.VPS_HOST }}
    username: deployer
    port: 22
    key: ${{ secrets.VPS_SSH_KEY }}
    timeout: 30s
    command_timeout: 10m
    script: |
      cd /var/www/app
      git pull origin main
      composer install --no-dev --optimize-autoloader
      php artisan optimize:clear
      php artisan migrate --force
